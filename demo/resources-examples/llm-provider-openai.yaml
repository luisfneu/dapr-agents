# Alternative: OpenAI. Copy over resources/llm-provider.yaml.
#   export OPENAI_API_KEY=sk-...
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: llm-provider
spec:
  type: conversation.openai
  version: v1
  metadata:
    - name: key
      envRef: OPENAI_API_KEY
    - name: model
      value: "gpt-4o-mini"
